<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1125" viewBox="0 0 1800 1125">
  <defs>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 46px; font-weight: 800; fill: #172033; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 500; fill: #5a6578; }
      .section-title { font-family: Arial, Helvetica, sans-serif; font-size: 23px; font-weight: 800; letter-spacing: 0.4px; fill: #1d2a44; }
      .box-title { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 800; fill: #152238; }
      .box-text { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 500; fill: #42506a; }
      .small-text { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 600; fill: #56627a; }
      .arrow-label { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; fill: #33415c; }
      .panel { fill: #f8fafc; stroke: #cbd6e6; stroke-width: 2; }
      .card { fill: #ffffff; stroke: #b7c6dc; stroke-width: 2; }
      .agent-card { fill: #eef8ff; stroke: #54a3d8; stroke-width: 2.4; }
      .workflow-card { fill: #fffaf0; stroke: #e0a531; stroke-width: 2.2; }
      .state-card { fill: #f2fbf7; stroke: #3aa77a; stroke-width: 2.2; }
      .backend-card { fill: #f5f2ff; stroke: #8a72d6; stroke-width: 2.2; }
      .human-card { fill: #fff5f5; stroke: #d66a6a; stroke-width: 2.2; }
      .arrow { fill: none; stroke: #526179; stroke-width: 3; marker-end: url(#arrowhead); }
      .arrow-soft { fill: none; stroke: #7c8ca5; stroke-width: 2.4; marker-end: url(#arrowhead-soft); }
      .arrow-memory { fill: none; stroke: #2f9b73; stroke-width: 3; marker-end: url(#arrowhead-green); }
      .arrow-human { fill: none; stroke: #c65a5a; stroke-width: 3; marker-end: url(#arrowhead-red); }
      .loop { fill: none; stroke: #2c7fb8; stroke-width: 3.2; stroke-dasharray: 9 7; marker-end: url(#arrowhead-blue); }
    </style>
    <marker id="arrowhead" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M 0 0 L 11 4 L 0 8 z" fill="#526179"/>
    </marker>
    <marker id="arrowhead-soft" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#7c8ca5"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M 0 0 L 11 4 L 0 8 z" fill="#2f9b73"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M 0 0 L 11 4 L 0 8 z" fill="#c65a5a"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M 0 0 L 11 4 L 0 8 z" fill="#2c7fb8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#172033" flood-opacity="0.11"/>
    </filter>
  </defs>

  <rect width="1800" height="1125" fill="#ffffff"/>

  <text x="900" y="64" text-anchor="middle" class="title">Human-in-the-loop OntoAnno Agent Framework</text>
  <text x="900" y="104" text-anchor="middle" class="subtitle">Natural-language task routing, reproducible function calling, evidence-aware review, and iterative human correction</text>

  <!-- Main panels -->
  <rect x="70" y="155" width="310" height="525" rx="28" class="panel" filter="url(#shadow)"/>
  <text x="225" y="198" text-anchor="middle" class="section-title">Researcher Interaction</text>

  <rect x="110" y="235" width="230" height="92" rx="18" class="human-card"/>
  <text x="225" y="270" text-anchor="middle" class="box-title">Agent-assisted mode</text>
  <text x="225" y="298" text-anchor="middle" class="box-text">Natural-language requests</text>

  <rect x="110" y="360" width="230" height="92" rx="18" class="human-card"/>
  <text x="225" y="395" text-anchor="middle" class="box-title">Manual worker console</text>
  <text x="225" y="423" text-anchor="middle" class="box-text">Direct expert control</text>

  <rect x="105" y="500" width="240" height="92" rx="18" fill="#ffffff" stroke="#e0a1a1" stroke-width="1.8"/>
  <text x="225" y="535" text-anchor="middle" class="box-title">Human feedback</text>
  <text x="225" y="563" text-anchor="middle" class="box-text">accept, correct, add evidence,</text>
  <text x="225" y="585" text-anchor="middle" class="box-text">or request deeper analysis</text>

  <rect x="440" y="155" width="445" height="525" rx="28" class="panel" filter="url(#shadow)"/>
  <text x="662" y="198" text-anchor="middle" class="section-title">Agent Reasoning Core</text>

  <rect x="540" y="245" width="245" height="72" rx="18" class="agent-card"/>
  <text x="662" y="276" text-anchor="middle" class="box-title">Natural-language</text>
  <text x="662" y="301" text-anchor="middle" class="box-title">understanding</text>

  <rect x="595" y="345" width="245" height="72" rx="18" class="agent-card"/>
  <text x="718" y="376" text-anchor="middle" class="box-title">Task routing</text>
  <text x="718" y="401" text-anchor="middle" class="box-title">and planning</text>

  <rect x="540" y="445" width="245" height="72" rx="18" class="agent-card"/>
  <text x="662" y="476" text-anchor="middle" class="box-title">Session and</text>
  <text x="662" y="501" text-anchor="middle" class="box-title">project memory</text>

  <rect x="485" y="345" width="245" height="72" rx="18" class="agent-card"/>
  <text x="608" y="376" text-anchor="middle" class="box-title">Result</text>
  <text x="608" y="401" text-anchor="middle" class="box-title">interpretation</text>

  <rect x="540" y="555" width="245" height="72" rx="18" class="agent-card"/>
  <text x="662" y="586" text-anchor="middle" class="box-title">Next-step</text>
  <text x="662" y="611" text-anchor="middle" class="box-title">proposal</text>

  <path d="M 662 318 C 780 325 812 355 826 383" class="loop"/>
  <path d="M 826 417 C 805 480 756 507 692 520" class="loop"/>
  <path d="M 630 520 C 555 502 515 460 505 414" class="loop"/>
  <path d="M 505 350 C 525 300 572 285 540 282" class="loop"/>

  <rect x="960" y="155" width="770" height="525" rx="28" class="panel" filter="url(#shadow)"/>
  <text x="1345" y="198" text-anchor="middle" class="section-title">Function-level Workflow Orchestration</text>
  <text x="1345" y="226" text-anchor="middle" class="small-text">Agent-selected callable workflows, not a fixed one-way pipeline</text>

  <rect x="1015" y="265" width="220" height="78" rx="17" class="workflow-card"/>
  <text x="1125" y="296" text-anchor="middle" class="box-title">Data preparation</text>
  <text x="1125" y="321" text-anchor="middle" class="box-title">and clustering</text>

  <rect x="1285" y="265" width="220" height="78" rx="17" class="workflow-card"/>
  <text x="1395" y="296" text-anchor="middle" class="box-title">Resolution evaluation</text>
  <text x="1395" y="321" text-anchor="middle" class="box-title">and selection</text>

  <rect x="1015" y="385" width="220" height="78" rx="17" class="workflow-card"/>
  <text x="1125" y="416" text-anchor="middle" class="box-title">Parent cell-type</text>
  <text x="1125" y="441" text-anchor="middle" class="box-title">annotation</text>

  <rect x="1285" y="385" width="220" height="78" rx="17" class="workflow-card"/>
  <text x="1395" y="416" text-anchor="middle" class="box-title">Targeted subcluster</text>
  <text x="1395" y="441" text-anchor="middle" class="box-title">annotation</text>

  <rect x="1015" y="505" width="220" height="78" rx="17" class="workflow-card"/>
  <text x="1125" y="536" text-anchor="middle" class="box-title">RAG-based</text>
  <text x="1125" y="561" text-anchor="middle" class="box-title">annotation review</text>

  <rect x="1285" y="505" width="220" height="78" rx="17" class="workflow-card"/>
  <text x="1395" y="536" text-anchor="middle" class="box-title">External evidence</text>
  <text x="1395" y="561" text-anchor="middle" class="box-title">curation</text>

  <rect x="1540" y="385" width="160" height="198" rx="17" class="workflow-card"/>
  <text x="1620" y="462" text-anchor="middle" class="box-title">Report and</text>
  <text x="1620" y="487" text-anchor="middle" class="box-title">annotation</text>
  <text x="1620" y="512" text-anchor="middle" class="box-title">export</text>

  <!-- Execution backend strip -->
  <rect x="155" y="730" width="1490" height="112" rx="26" fill="#f7f5ff" stroke="#c8bbef" stroke-width="2.2" filter="url(#shadow)"/>
  <text x="900" y="765" text-anchor="middle" class="section-title">Execution Backends</text>
  <rect x="210" y="785" width="255" height="40" rx="13" class="backend-card"/>
  <text x="338" y="812" text-anchor="middle" class="box-text">Python orchestration controller</text>
  <rect x="505" y="785" width="235" height="40" rx="13" class="backend-card"/>
  <text x="622" y="812" text-anchor="middle" class="box-text">R / GPTAnno annotation engine</text>
  <rect x="780" y="785" width="230" height="40" rx="13" class="backend-card"/>
  <text x="895" y="812" text-anchor="middle" class="box-text">Reference database retrieval</text>
  <rect x="1050" y="785" width="220" height="40" rx="13" class="backend-card"/>
  <text x="1160" y="812" text-anchor="middle" class="box-text">LLM comparison judge</text>
  <rect x="1310" y="785" width="260" height="40" rx="13" class="backend-card"/>
  <text x="1440" y="812" text-anchor="middle" class="box-text">Human review interface</text>

  <!-- Persistent state panel -->
  <rect x="110" y="905" width="1580" height="160" rx="28" fill="#f5fcf9" stroke="#b8dfcf" stroke-width="2.4" filter="url(#shadow)"/>
  <text x="900" y="945" text-anchor="middle" class="section-title">Project State, Evidence, and Artifacts</text>
  <rect x="160" y="975" width="285" height="54" rx="15" class="state-card"/>
  <text x="302" y="1007" text-anchor="middle" class="box-text">Configuration and user preferences</text>
  <rect x="475" y="975" width="260" height="54" rx="15" class="state-card"/>
  <text x="605" y="1007" text-anchor="middle" class="box-text">Session and evidence memory</text>
  <rect x="765" y="975" width="260" height="54" rx="15" class="state-card"/>
  <text x="895" y="1007" text-anchor="middle" class="box-text">Marker genes and Seurat artifacts</text>
  <rect x="1055" y="975" width="270" height="54" rx="15" class="state-card"/>
  <text x="1190" y="1007" text-anchor="middle" class="box-text">Review decisions and revised labels</text>
  <rect x="1355" y="975" width="285" height="54" rx="15" class="state-card"/>
  <text x="1498" y="1007" text-anchor="middle" class="box-text">Logs, manifests, and reports</text>

  <!-- Primary human-agent loop -->
  <path d="M 340 282 C 390 282 410 282 440 282" class="arrow-human"/>
  <text x="390" y="263" text-anchor="middle" class="arrow-label">request</text>
  <path d="M 785 592 C 815 625 840 650 890 685 C 945 724 980 742 1030 770" class="arrow"/>
  <text x="880" y="650" text-anchor="middle" class="arrow-label">function calling</text>
  <path d="M 950 730 C 875 690 825 660 785 615" class="arrow-soft"/>
  <text x="920" y="700" text-anchor="middle" class="arrow-label">results, exceptions, summaries</text>
  <path d="M 540 592 C 430 650 320 645 225 592" class="arrow-human"/>
  <text x="380" y="665" text-anchor="middle" class="arrow-label">summary + suggested next action</text>
  <path d="M 225 500 C 275 455 340 415 485 392" class="arrow-human"/>
  <text x="340" y="452" text-anchor="middle" class="arrow-label">feedback</text>

  <!-- Agent to workflows -->
  <path d="M 840 381 C 900 380 925 372 965 345" class="arrow"/>
  <text x="910" y="353" text-anchor="middle" class="arrow-label">task route</text>
  <path d="M 840 383 C 918 410 940 422 1015 424" class="arrow-soft"/>
  <path d="M 820 480 C 900 512 935 535 1015 544" class="arrow-soft"/>
  <path d="M 785 592 C 910 595 1070 580 1285 555" class="arrow-soft"/>

  <!-- Workflow dependencies -->
  <path d="M 1235 304 L 1285 304" class="arrow-soft"/>
  <path d="M 1395 343 C 1395 360 1280 370 1235 410" class="arrow-soft"/>
  <path d="M 1235 424 L 1285 424" class="arrow-soft"/>
  <text x="1260" y="405" text-anchor="middle" class="small-text">feeds</text>
  <path d="M 1125 463 L 1125 505" class="arrow-soft"/>
  <path d="M 1505 544 C 1535 535 1545 510 1540 485" class="arrow-soft"/>

  <!-- Evidence and RAG connections -->
  <path d="M 1395 583 C 1320 635 1215 650 1125 583" class="arrow-memory"/>
  <text x="1265" y="640" text-anchor="middle" class="arrow-label">evidence support</text>
  <path d="M 1395 583 C 1245 770 825 890 605 975" class="arrow-memory"/>
  <text x="1060" y="900" text-anchor="middle" class="arrow-label">curated evidence memory</text>

  <!-- Workflow to execution -->
  <path d="M 1125 583 C 1065 650 1035 705 1000 730" class="arrow"/>
  <path d="M 1395 583 C 1390 650 1405 710 1435 785" class="arrow"/>
  <path d="M 1620 583 C 1585 660 1535 715 1498 785" class="arrow"/>
  <path d="M 1125 343 C 950 610 620 720 622 785" class="arrow-soft"/>
  <path d="M 1125 583 C 1055 650 950 715 895 785" class="arrow-soft"/>
  <path d="M 1125 583 C 1160 670 1160 725 1160 785" class="arrow-soft"/>
  <path d="M 1125 583 C 1210 675 1320 730 1440 785" class="arrow-soft"/>

  <!-- Execution to state -->
  <path d="M 338 825 C 330 870 315 935 302 975" class="arrow-memory"/>
  <path d="M 622 825 C 622 875 615 930 605 975" class="arrow-memory"/>
  <path d="M 895 825 L 895 975" class="arrow-memory"/>
  <path d="M 1440 825 C 1395 875 1280 930 1190 975" class="arrow-memory"/>
  <path d="M 1498 825 L 1498 975" class="arrow-memory"/>

  <!-- State feedback -->
  <path d="M 605 975 C 495 850 490 720 540 627" class="arrow-memory"/>
  <text x="475" y="835" text-anchor="middle" class="arrow-label">memory-informed reasoning</text>
  <path d="M 895 975 C 900 850 855 735 785 502" class="arrow-memory"/>
  <text x="835" y="890" text-anchor="middle" class="arrow-label">artifact context</text>

  <!-- RAG to reviewed labels to export -->
  <path d="M 1125 583 C 1210 690 1300 740 1440 785" class="arrow-human"/>
  <text x="1275" y="710" text-anchor="middle" class="arrow-label">unresolved clusters</text>
  <path d="M 1440 825 C 1485 855 1560 860 1620 583" class="arrow-human"/>
  <text x="1595" y="750" text-anchor="middle" class="arrow-label">reviewed labels</text>
</svg>

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ontoanno"
version = "0.1.0"
description = "CLI orchestration layer for GPTAnno and PDF2markers"
requires-python = ">=3.11"
dependencies = ["PyYAML", "Jinja2", "Pillow", "pandas", "openpyxl"]

[project.optional-dependencies]
ui = ["streamlit>=1.40"]

[project.scripts]
ontoanno = "ontoanno.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

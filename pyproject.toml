[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "annoagent"
version = "0.1.0"
description = "CLI orchestration layer for GPTAnno and PDF2markers"
requires-python = ">=3.11"
dependencies = ["PyYAML", "Jinja2", "Pillow"]

[project.scripts]
annoagent = "annoagent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

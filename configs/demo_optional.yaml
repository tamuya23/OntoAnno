project:
  name: DemoProjectOptional
  work_dir: /work/DemoProjectOptional

inputs:
  seurat_rds: /data/my_project/my_dataset.rds
  # Optional reference labels for evaluation/comparison only.
  reference_labels_csv: null
  # Optional literature PDFs for external evidence extraction.
  pdf_dir: null
  # Optional precomputed cluster markers. If set, OntoAnno skips marker detection
  # and starts parent annotation from markers_res_<resolution>.rds files.
  marker_genes_dir: null

policy:
  ontology: true
  granularity: balanced
  fallback: up
  review_tie: true
  review_nomatch: true

llm:
  annotation:
    provider: openai
    model: gpt-5
    api_key: ${OPENAI_API_KEY}
    api_url: ${OPENAI_BASE_URL}
    system_prompt: null
  external_evidence:
    model: gpt-5
    env:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
  pdfmarkers:
    model: gpt-5-nano
    env:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}

annotation:
  species: human
  parent_res:
    - 0.1
    - 0.3
  sub_res:
    - 0.1
    - 0.2
  preprocess: true
  min_cell_count: 3000
  tissue_name: replace_with_your_dataset_tissue
  n_runs_parent: 10
  n_runs_sub: 10

alignment:
  # Optional: predefine parent cell types to subcluster.
  celltypes_to_subcluster: null
  user_restrict_to: {}
  combine_restrictions: true
  manual_resolution_map: {}
  on_missing_decision: stop

evaluation:
  enabled: false
  # Column name inside reference_labels_csv when evaluation.enabled is true.
  manual_col: null
  baselines: []

report:
  format: html

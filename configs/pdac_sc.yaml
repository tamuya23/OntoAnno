project:
  name: PDAC_sc
  work_dir: /proj/bzou_lab/projects/AnnoAgent/work/PDAC_sc

inputs:
  seurat_rds: /proj/bzou_lab/projects/GPTAnno_Experiment/PDAC_sc/PDAC_sc_umap.rds
  manual_labels_csv: /proj/bzou_lab/projects/GPTAnno_Experiment/PDAC_sc/PDAC_singleR_annotation.csv
  pdf_dir: null
  bootstrap_parent:
    annotation_parent_rds: /proj/bzou_lab/projects/GPTAnno_Experiment/PDAC_sc/output/annotation_parent_nonCM.rds
    annotation_scores_csv: /proj/bzou_lab/projects/GPTAnno_Experiment/PDAC_sc/output/annotation_summary_scores_nonCM.csv
    parent_seurat_rds: /proj/bzou_lab/projects/GPTAnno_Experiment/PDAC_sc/output/PDAC_GPTannotated_parent_RNAorig.rds
    markers_dir: /proj/bzou_lab/projects/GPTAnno_Experiment/PDAC_sc/output/marker_genes
    prediction_dir: /proj/bzou_lab/projects/GPTAnno_Experiment/PDAC_sc/output/prediction
    best_resolution: res_0.1
    cluster_col: cluster_res.0.1

policy:
  ontology: true
  granularity: balanced
  fallback: up
  review_tie: true
  review_nomatch: true

llm:
  annotation:
    provider: openai
    model: gpt-5
    api_key: ${OPENAI_API_KEY}
    api_url: null
    system_prompt: null
  pdfmarkers:
    model: gpt-5-nano
    env:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}

annotation:
  species: human
  parent_res: [0.1, 0.3, 0.5, 0.7, 0.9, 1.0]
  sub_res: [0.1, 0.2, 0.3]
  preprocess: false
  min_cell_count: 5000
  tissue_name: Human pancreatic ductal adenocarcinoma (PDAC) tumor or normal tissue
  n_runs_parent: 10
  n_runs_sub: 10

alignment:
  celltypes_to_subcluster: null
  user_restrict_to: {}
  combine_restrictions: true
  manual_resolution_map: {}
  on_missing_decision: stop

evaluation:
  enabled: true
  manual_col: CL_name
  baselines: []

report:
  format: html

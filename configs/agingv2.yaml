project:
  name: AgingV2
  work_dir: /proj/bzou_lab/projects/OntoAnno/work/AgingV2
inputs:
  seurat_rds: /proj/bzou_lab/projects/GPTAnno_Experiment/AgingV2/Aging_preprocessed.rds
  manual_labels_csv: /proj/bzou_lab/projects/GPTAnno_Experiment/AgingV2/Aging_metadata_update.csv
  pdf_dir: null
  # Optional: precomputed GPTAnno marker folder with markers_res_<resolution>.rds files.
  # When set, OntoAnno skips parent clustering/marker recomputation and starts from annotation.
  # The Seurat metadata must already contain cluster_res.<resolution> columns for annotation.parent_res.
  marker_genes_dir: null
  # Optional: import an existing GPTAnno annotation_parent*.rds and run RAG check/report from it.
  # OntoAnno can infer sibling annotation_summary_scores*.csv, marker_genes/, prediction/,
  # and *GPTannotated_parent*.rds when they sit in the same output folder.
  annotation_parent_rds: null
policy:
  ontology: true
  granularity: fine
  fallback: up
  review_tie: true
  review_nomatch: true
llm:
  annotation:
    provider: openai
    model: gpt-5
    api_key: ${OPENAI_API_KEY}
    api_url: null
    system_prompt: null
  external_evidence:
    model: gpt-5
    env:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
  pdfmarkers:
    model: gpt-5-nano
    env:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
annotation:
  species: mouse
  parent_res:
  - 0.1
  - 0.3
  sub_res:
  - 0.1
  - 0.3
  preprocess: false
  min_cell_count: 5000
  tissue_name: mouse adult heart non-cardiomyocytes
  n_runs_parent: 10
  n_runs_sub: 10
alignment:
  celltypes_to_subcluster: null
  user_restrict_to: {}
  combine_restrictions: true
  manual_resolution_map: {}
  on_missing_decision: stop
evaluation:
  enabled: true
  manual_col: celltype.lv1
  baselines: []
report:
  format: html

project:
  name: PDAC_sn
  work_dir: /proj/bzou_lab/projects/OntoAnno/work/PDAC_sn
inputs:
  seurat_rds: /proj/bzou_lab/projects/GPTAnno_Experiment/PDAC_sn/PDAC_sn.rds
  manual_labels_csv: /proj/bzou_lab/projects/GPTAnno_Experiment/PDAC_sn/PDAC_singleR_annotation.csv
  pdf_dir: null
  # Optional: precomputed GPTAnno marker folder with markers_res_<resolution>.rds files.
  # When set, OntoAnno skips parent clustering/marker recomputation and starts from annotation.
  # The Seurat metadata must already contain cluster_res.<resolution> columns for annotation.parent_res.
  marker_genes_dir: null
policy:
  ontology: true
  granularity: balanced
  fallback: up
  review_tie: true
  review_nomatch: true
llm:
  annotation:
    provider: openai
    model: gpt-5
    api_key: ${OPENAI_API_KEY}
    api_url: null
    system_prompt: null
  pdfmarkers:
    model: gpt-5-nano
    env:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
annotation:
  species: human
  parent_res:
  - 0.1
  - 0.3
  sub_res:
  - 0.1
  - 0.2
  preprocess: true
  min_cell_count: 5000
  tissue_name: Human pancreatic ductal adenocarcinoma (PDAC) tumor
  n_runs_parent: 10
  n_runs_sub: 10
alignment:
  celltypes_to_subcluster:
  - macrophage
  user_restrict_to: {}
  combine_restrictions: true
  manual_resolution_map: {}
  on_missing_decision: stop
evaluation:
  enabled: true
  manual_col: SingleR_labels
  baselines: []
report:
  format: html

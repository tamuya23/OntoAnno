services:
  ontoanno:
    build:
      context: .
      dockerfile: Dockerfile
    image: ontoanno:local
    ports:
      - "${ONTOANNO_PORT:-8501}:8501"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ONTOANNO_CL_OBO: ${ONTOANNO_CL_OBO:-}
      ONTOANNO_CONFIG: ${ONTOANNO_CONFIG:-/app/configs/docker_import_template.yaml}
      ONTOANNO_PORT: ${ONTOANNO_PORT:-8501}
    volumes:
      - ./configs:/app/configs
      - ./runs:/app/runs
      - ./work:/work
      - ./data:/data

